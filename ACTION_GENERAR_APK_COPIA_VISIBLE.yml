name: Generar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar APK
        run: gradle assembleDebug

      - name: Cambiar nombre del APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Participaciones_Secundaria_v1.0.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Participaciones_Secundaria_v1.0
          path: app/build/outputs/apk/debug/Participaciones_Secundaria_v1.0.apk
