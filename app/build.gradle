plugins { id 'com.android.application' }

android {
    namespace 'com.luis.participaciones.secundaria'
    compileSdk 35

    signingConfigs {
        personal {
            storeFile file('participaciones-release.jks')
            storePassword 'Participaciones2026'
            keyAlias 'participaciones'
            keyPassword 'Participaciones2026'
        }
